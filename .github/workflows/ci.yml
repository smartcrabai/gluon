name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install taplo
        shell: bash
        run: |
          if ! command -v taplo &> /dev/null; then
            curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
              | gzip -d - | install -m 755 /dev/stdin /usr/local/bin/taplo
          fi

      - name: Lint Cargo.toml
        shell: bash
        run: taplo lint Cargo.toml

      - name: Check Cargo.toml formatting
        shell: bash
        run: taplo fmt --check --option reorder_keys=true Cargo.toml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run sakoku
        uses: smartcrabai/sakoku@836620700bc1537d58a1be0dae8fa8ac54767673 # v0.3.0
        with:
          paths: crates
          strict: 'true'

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Install authentication native dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Run cargo check without authentication
        shell: bash
        run: cargo check -p gluon --no-default-features --lib --locked

      - name: Build all examples including screenless authentication
        shell: bash
        run: cargo build --manifest-path examples/Cargo.toml --workspace

      - name: Run authentication example OTP session JWT process contract
        shell: bash
        run: cargo test --manifest-path examples/Cargo.toml -p sample-auth --test process

      - name: Run cargo check
        shell: bash
        run: cargo check --workspace --all-features

      - name: Run tests
        shell: bash
        run: cargo test --workspace --all-features

      - name: Run PostgreSQL authentication contracts explicitly
        shell: bash
        run: cargo test -p gluon --features auth --test auth_postgres --locked

      - name: Run clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  csrf-spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load exact CSRF tool versions
        shell: bash
        run: |
          grep -E '^[A-Z_][A-Z_0-9]*=' scripts/csrf-tools.env >> "$GITHUB_ENV"
          mkdir -p target/csrf-spec

      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}.0.LTS

      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install checksum-verified formal tools
        shell: bash
        run: |
          set -o pipefail
          bash scripts/setup-csrf-specs.sh 2>&1 | tee target/csrf-spec/setup.log

      - name: Test formal runner failure detection
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/check-csrf-runners.test.cjs 2>&1 | tee target/csrf-spec/runner-tests.log

      - name: Check Quint invariants and witnesses
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-csrf-quint.sh

      - name: Check Alloy assertions and satisfiable witnesses
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-csrf-alloy.sh

      - name: Execute strict production Gherkin
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p gluon --test csrf_spec 2>&1 | tee target/csrf-spec/gherkin.log

      - name: Preserve production middleware regression check
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p gluon --test csrf_middleware 2>&1 | tee target/csrf-spec/production.log

      - name: Retain CSRF check reports and bounded traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: csrf-spec-results
          path: target/csrf-spec/
          if-no-files-found: error
          retention-days: 7

  platform-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install macOS authentication native dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install openssl@3 pkg-config
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure Windows authentication native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
          "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Run platform tests
        run: >-
          cargo test --workspace --all-features --
          --skip database_lifecycle_and_seed_work_against_postgres
          --skip generated_postgres_repository_supports_crud
          --skip postgres_sessions_persist_across_instances
          --skip postgres_auth_store_contracts
          --skip postgres_preloaded_independent_sessions_cannot_restore_revoked_logins
          --skip postgres_login_authority_failure_is_not_anonymous_or_successful_logout
          --skip postgres_v1_upgrade_adds_login_authority_without_changing_existing_data
          --skip postgres_login_authority_write_failure_cannot_leave_an_authenticated_cookie
          --skip postgres_login_cleanup_enforces_idle_and_absolute_deadlines_for_cached_cookies
