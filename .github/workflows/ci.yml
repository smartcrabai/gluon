name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install taplo
        shell: bash
        run: |
          if ! command -v taplo &> /dev/null; then
            curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
              | gzip -d - | install -m 755 /dev/stdin /usr/local/bin/taplo
          fi

      - name: Lint Cargo.toml
        shell: bash
        run: taplo lint Cargo.toml

      - name: Check Cargo.toml formatting
        shell: bash
        run: taplo fmt --check --option reorder_keys=true Cargo.toml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run sakoku
        uses: smartcrabai/sakoku@836620700bc1537d58a1be0dae8fa8ac54767673 # v0.3.0
        with:
          paths: crates
          strict: 'true'

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Run cargo check
        shell: bash
        run: cargo check --workspace --all-features

      - name: Run tests
        shell: bash
        run: cargo test --workspace --all-features

      - name: Run clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  platform-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run platform tests
        run: >-
          cargo test --workspace --all-features --
          --skip database_lifecycle_and_seed_work_against_postgres
          --skip generated_postgres_repository_supports_crud
          --skip postgres_sessions_persist_across_instances

