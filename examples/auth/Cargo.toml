[package]
name = "sample-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
gluon = { path = "../../crates/gluon", features = ["auth"] }
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
async-trait = "0.1"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["cookies", "json", "rustls"] }
serde_json = "1"
tempfile = "3"
