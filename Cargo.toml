[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
homepage = "https://github.com/smartcrabai/gluon"
license = "MIT"
repository = "https://github.com/smartcrabai/gluon"
version = "0.1.3"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
axum-test = "21"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "3", features = ["pkcs8", "pem"] }
encre-css = "0.21.1"
form_urlencoded = "1"
futures-util = "0.3"
glob = "0.3"
heck = "0.5"
hmac = "0.13"
http = "1"
insta = { version = "1", default-features = false }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = [
  "rust_crypto",
  "use_pem",
] }
jsxrs = "0.1.7"
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1-rustls-tls",
  "ring",
  "webpki-roots",
] }
mime_guess = "2"
minijinja = { version = "3", features = ["serde"] }
notify = "8"
oauth2 = { version = "5", default-features = false }
openidconnect = { version = "4", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = [
  "trace",
] }
opentelemetry-otlp = { version = "0.33", features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33", features = ["trace", "rt-tokio"] }
proc-macro2 = "1"
quote = "1"
rand = "0.10"
regex = "1"
reqwest = { version = "=0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "cookies",
] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serial_test = "4"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "time"] }
subtle = "2"
syn = { version = "3", features = ["full"] }
tempfile = "3"
testcontainers-modules = { version = "0.15", default-features = false, features = [
  "postgres",
  "ring",
] }
thiserror = "2"
time = { version = "0.3", default-features = false }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal"] }
toml = "0.9"
tower = "0.5"
tower-cookies = "0.11"
tower-http = { version = "0.7", features = ["fs"] }
tower-sessions = { version = "0.15", features = ["signed"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trybuild = "1"
ts-rs = "12"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
webauthn-rs = { version = "=0.5.5", features = [
  "conditional-ui",
  "danger-allow-state-serialisation",
] }

[workspace.metadata.dist]
allow-dirty = ["ci"]
cargo-dist-version = "0.32.0"
ci = "github"
install-path = "CARGO_HOME"
installers = ["shell", "homebrew"]
packages = ["gluon-cli"]
pr-run-mode = "upload"
precise-builds = true
publish-jobs = ["homebrew"]
tap = "smartcrabai/homebrew-tap"
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[workspace.metadata.dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

[workspace.lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dist]
inherits = "release"
